  <style>
    :root { color-scheme: light; font: 16px/1.75 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #20313f; background: #f7f8fa; }
    body { margin: 0; }
    main { box-sizing: border-box; width: min(720px, 100% - 32px); margin: 40px auto; padding: clamp(24px, 5vw, 48px); background: #fff; border: 1px solid #e5e9ee; border-radius: 20px; box-shadow: 0 12px 40px #1e33400d; }
    h1, h2 { line-height: 1.3; color: #172a38; }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 36px); }
    h2 { margin: 32px 0 8px; font-size: 20px; }

<body>
  <main>
    <h1>口琴练习室使用帮助</h1>
    <h2>如何开始练习？</h2>
    <p>在首页点“曲库选歌”，选择一首曲目并打开详情页，然后点“开始跟练”。如使用跟随演奏，请允许麦克风访问。</p>
    <h2>如何导入简谱图片？</h2>
    <p>打开“曲库”并点“识图录入”。此功能需要一次性永久解锁。解锁后可选择或拍摄简谱图片，识别结果会进入曲谱编辑器供校对。</p>
    <h2>如何恢复识图购买？</h2>
    <p>打开应用内的识图解锁页并点“恢复购买”。请使用购买时的 Apple 账户。</p>
    <h2>练习录音和曲谱存在哪里？</h2>
    <p>录音、曲谱、练习结果和偏好保存在设备本机。删除练习记录会同时删除对应的本机录音。</p>

  </main>
